<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proveedores | BRavo</title><style>:root{font-family:system-ui,sans-serif;color:#10241b;background:#f3f8f4}*{box-sizing:border-box}body{margin:0}header{background:#092a1c;color:white;padding:25px max(20px,calc((100vw - 1000px)/2))}a{color:inherit}main{max-width:1000px;margin:35px auto;padding:0 20px}h1{margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:white;border:1px solid #dce7de;border-radius:16px;padding:22px}small{color:#56705f}.tag{display:inline-block;background:#e0f3e5;color:#12663a;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}li{margin:10px 0}button{background:#087a45;color:white;border:0;border-radius:10px;padding:12px;cursor:pointer}</style></head><body><header><a href="/">← BRavo</a><h1>Proveedores y servicios</h1><p>Explora negocios autorizados con servicios disponibles.</p></header><main><p id="status" role="status">Cargando proveedores…</p><div id="catalog" class="grid"></div></main><script type="module">const root=document.getElementById('catalog'),status=document.getElementById('status');const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};try{const id=new URLSearchParams(location.search).get('id');const u='/api/partners/catalog'+(id?'?id='+encodeURIComponent(id):'');const r=await fetch(u);const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo cargar');const partners=data.partners||[];status.textContent=partners.length?partners.length+' negocios disponibles':'Todavía no hay proveedores publicados.';for(const p of partners){const card=el('article','');card.className='card';card.append(el('span','Negocio autorizado'));card.lastChild.className='tag';card.append(el('h2',p.display_name));card.append(el('p',p.description||'Sin descripción'));if(p.website_url){try{const url=new URL(p.website_url);if(['https:','http:'].includes(url.protocol)){const link=el('a','Visitar sitio web ↗');link.href=url.href;link.rel='noopener noreferrer';link.target='_blank';card.append(link)}}catch{}}card.append(el('h3','Servicios'));const ul=el('ul','');for(const service of p.services||[]){const li=el('li','');li.append(el('strong',service.title));li.append(el('p',service.description||service.category));ul.append(li)}card.append(ul);root.append(card)}}catch(e){status.textContent=e.message}</script></body></html>
